services:
  postgres:
    image: postgres:16
    container_name: postgres_pet
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset_pet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    ports:
      - "8088:8088"
    networks:
      - analytics-net
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname admin
      --lastname admin
      --email admin@example.com
      --password ${SUPERSET_ADMIN_PASSWORD} || true &&
      superset init &&
      /usr/bin/run-server.sh
      "

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: airflow_init_pet
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: "50000"
    user: "50000:0"
    networks:
      - analytics-net
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@example.com
      --password ${AIRFLOW_ADMIN_PASSWORD} || true
      "

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: airflow_webserver_pet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: "50000"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-clickhouse==1.7.4"
    user: "50000:0"
    ports:
      - "8080:8080"
    networks:
      - analytics-net
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler_pet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: "50000"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-clickhouse==1.7.4"
    user: "50000:0"
    ports:
      - "8085:8085"
    networks:
      - analytics-net
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_pet
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - analytics-net

  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: kafka_connect_pet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres
    networks:
      - analytics-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_pet
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      kafka-connect:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - analytics-net

  minio:
    image: minio/minio:latest
    container_name: minio_pet
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - analytics-net

  minio-init:
    image: minio/mc:latest
    container_name: minio_init_pet
    depends_on:
      - minio
    networks:
      - analytics-net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do
        echo 'waiting for minio...' && sleep 2;
      done;
      /usr/bin/mc mb -p local/lake || true;
      /usr/bin/mc anonymous set private local/lake || true;
      exit 0;
      "

  spark-master:
    image: spark:3.5.1
    container_name: spark_master_pet
    restart: unless-stopped
    depends_on:
      - kafka
      - minio
    ports:
      - "7077:7077"
      - "8082:8080"
    entrypoint: []
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    networks:
      - analytics-net

  spark-worker:
    image: spark:3.5.1
    container_name: spark_worker_pet
    restart: unless-stopped
    depends_on:
      - spark-master
    ports:
      - "8084:8081"
    entrypoint: []
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
      - --cores
      - "4"
      - --memory
      - 6G
    networks:
      - analytics-net

  spark-app:
    image: spark:3.5.1
    container_name: spark_app_pet
    restart: unless-stopped
    depends_on:
      - spark-master
      - kafka
      - minio
    volumes:
      - ./spark:/opt/spark-apps
    working_dir: /opt/spark-apps
    command: >
      /bin/sh -c "sleep infinity"
    networks:
      - analytics-net

  zookeeper:
    image: zookeeper:3.7
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    networks:
      - analytics-net

  clickhouse01:
    image: clickhouse/clickhouse-server:22.5
    container_name: clickhouse01
    hostname: clickhouse01
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./clickhouse/clickhouse01:/etc/clickhouse-server
    networks:
      - analytics-net

  clickhouse02:
    image: clickhouse/clickhouse-server:22.5
    container_name: clickhouse02
    hostname: clickhouse02
    restart: unless-stopped
    depends_on:
      - zookeeper
    volumes:
      - ./clickhouse/clickhouse02:/etc/clickhouse-server
    networks:
      - analytics-net

  clickhouse03:
    image: clickhouse/clickhouse-server:22.5
    container_name: clickhouse03
    hostname: clickhouse03
    restart: unless-stopped
    depends_on:
      - zookeeper
    volumes:
      - ./clickhouse/clickhouse03:/etc/clickhouse-server
    networks:
      - analytics-net

  clickhouse04:
    image: clickhouse/clickhouse-server:22.5
    container_name: clickhouse04
    hostname: clickhouse04
    restart: unless-stopped
    depends_on:
      - zookeeper
    volumes:
      - ./clickhouse/clickhouse04:/etc/clickhouse-server
    networks:
      - analytics-net

volumes:
  postgres_data:
  kafka_data:
  minio_data:

networks:
  analytics-net:
    driver: bridge
